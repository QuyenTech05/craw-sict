# VM-SERVE 2 GiB = infra + API + nginx (chạy 24/7); VM-EMBED 4 GiB chỉ chạy embed.
# Batch chạy bên ngoài hai VM serving qua profile batch/manual (xem docs/batch-off-serving.md).
# D12 (2026-11-01): store có mật khẩu / API key lấy từ .env (POSTGRES_PASSWORD, REDIS_PASSWORD, QDRANT_API_KEY);
# cổng store chỉ mở trên STORE_BIND (mặc định 127.0.0.1: máy dev / 1 máy). VM1 đặt STORE_BIND=0.0.0.0 để VM2 tới
# được — trên EC2 card mạng chỉ có IP private, nên cửa thật là Security Group (chỉ SG của VM2 vào 5432/6379/
# 6333-6334) + mật khẩu. Bỏ trống mật khẩu = như cũ (chỉ dùng cho dev); `scripts/store_auth.sh check vm1` (CD
# chạy trước `up`) chặn deploy khi thiếu.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sict
      # chỉ có tác dụng lúc khởi tạo data dir; đổi mật khẩu DB đã có: `scripts/store_auth.sh sync-pg` (CD gọi)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sict}
      POSTGRES_DB: sict_crawler
    ports: ["${STORE_BIND:-127.0.0.1}:5432:5432"]
    volumes: [./.pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    # Ngân sách thử VM-SERVE 2 GiB: tổng container 1746 MiB, còn 302 MiB cho OS/overhead.
    mem_limit: ${PG_MEM_LIMIT:-384m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sict -d sict_crawler >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-64MB}", "-c", "max_connections=${PG_MAX_CONNECTIONS:-20}"]

  redis:
    image: redis:7
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-64mb}", "--maxmemory-policy", "volatile-ttl",
              "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports: ["${STORE_BIND:-127.0.0.1}:6379:6379"]
    volumes: [redisdata:/data]
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.19.1   # ghim (D11): bản đang chứa index v3; nâng = đổi tag có chủ đích
    ports: ["${STORE_BIND:-127.0.0.1}:6333:6333", "${STORE_BIND:-127.0.0.1}:6334:6334"]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}   # rỗng = không khoá (dev); /healthz, /readyz không cần khoá
    volumes: [qdata:/qdrant/storage]
    restart: unless-stopped
    # 850 MiB là mức khởi đầu cần kiểm tra RSS/OOM trên index v3 thật.
    mem_limit: ${QDRANT_MEM_LIMIT:-850m}

  api:
    image: ${API_IMAGE:-sict-api:latest}   # CD đặt ghcr.io/…/sict-api:<sha> trong .env (D10); local = build
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn sict_crawler.api.routes:app --host 0.0.0.0 --port 8000
    ports: ["8003:8000"]  # host 8000/8001 đã bị project khác chiếm
    env_file: [{path: .env, required: false}]  # fresh clone chưa có .env vẫn up được (dùng defaults)
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_API_BASE: ${VLM_API_BASE:-}
      VLM_MODELS: ${VLM_MODELS:-}
      VLM_ENABLED: ${VLM_ENABLED:-false}
      HF_TOKEN: ${HF_TOKEN:-}
      # API nói chuyện với store qua mạng compose (tên service), không qua STORE_BIND
      POSTGRES_DSN: postgresql+asyncpg://sict:${POSTGRES_PASSWORD:-sict}@postgres:5432/sict_crawler
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      HF_HOME: /cache/hf
      MVP_JOB_ROOT: /var/lib/sict-mvp/jobs
      MVP_JOB_TOKEN: ${MVP_JOB_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE-quyen-admin}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    volumes: [hfcache:/cache/hf, "${AWS_DIR:-${HOME}/.aws}:/home/app/.aws:ro", "${API_LOCAL_STORE:-api_localstore}:/app/_local_store:ro", mvp_jobs:/var/lib/sict-mvp/jobs]
    restart: unless-stopped
    # API chỉ dùng HTTP embed gateway, không nạp model tại tiến trình API.
    mem_limit: ${API_MEM_LIMIT:-320m}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

  # L0 edge: reverse proxy + cache truoc api (AC-K1..K5). Nghe 8080,
  # api giu nguyen 8003 de khong vo deploy hien tai; cat-over sau.
  nginx:
    image: nginx:1.31.6-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro", ngcache:/var/cache/nginx]
    depends_on: [api]
    restart: unless-stopped
    mem_limit: ${NGINX_MEM_LIMIT:-64m}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

volumes:
  pgdata:
  qdata:
  hfcache:
  api_localstore:
  ngcache:
  redisdata:  # persist frontier/seen + heartbeat (restart không mất hàng đợi)
  mvp_jobs:  # Job state, checkpoint và artifacts bền qua container restart
