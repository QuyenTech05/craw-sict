# Compute snapshot → artifact với embedding HTTP; không cần GPU.
#   docker build -f Dockerfile.worker -t sict-worker:latest .
#   HOST_UID=$(id -u) HOST_GID=$(id -g) SNAPSHOT=_snapshot/2026-10-12 \
#     docker compose -f docker-compose.gpu.yml run --rm compute
services:
  compute:
    image: ${WORKER_IMAGE:-sict-worker:latest}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      SICT_CONFIG: /app/config.yaml
      EMBED_BACKEND: api
      EMBED_API_BASE: ${EMBED_API_BASE:-http://embed:8090/v1}
      EMBED_MODEL: jina-clip-v2
      EMBED_DIM: 1024
      HF_HOME: /work/.hf-cache
      YT_COOKIES: /cookies/cookies.txt
      HOME: /work
    working_dir: /app
    volumes:
      - ./sict_crawler:/app/sict_crawler:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./_snapshot:/app/_snapshot          # snapshot vào, artifact ra (cùng thư mục)
      - ./.hf-cache:/work/.hf-cache
      - ./cookies:/cookies:ro               # keyframe/phụ đề YouTube (IP cloud hay bị chặn)
    command: ["python", "-m", "sict_crawler.pipeline.compute", "--snapshot", "${SNAPSHOT:-_snapshot/2026-10-12}"]
