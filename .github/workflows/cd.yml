name: CD
# push main → chỉ deploy VM-SERVE. VM-EMBED chỉ chạy khi workflow_dispatch với deploy_embed=true.
# Không deploy worker/cron/Obscura trên hai máy serving. Batch chạy riêng sau khi owner duyệt.
# Rollback = chạy lại với SHA v3 cũ, sau khi xác nhận index fingerprint tương thích.
# Chỉ chạy từ main; job deploy dùng environment `production` (thêm Required reviewers trong Settings → Environments
# để phải duyệt trước khi chạy — bật qua UI, trigger push vẫn tôn trọng reviewers).
# Secrets: VM1_HOST, VM1_KEY, VM2_HOST, VM2_KEY (đã có); alloy thêm GCLOUD_HOSTED_METRICS_URL, GCLOUD_HOSTED_METRICS_ID,
#   GCLOUD_SCRAPE_INTERVAL, GCLOUD_HOSTED_LOGS_URL, GCLOUD_HOSTED_LOGS_ID, GCLOUD_RW_API_KEY.
# SSH không phải cổng 22 (máy sau NAT port-forward, 2026-11-13): đặt repository variable
#   VM1_SSH_PORT / VM2_SSH_PORT (Settings → Variables); trống = 22.
# Trên VM: IP/mật khẩu nội bộ nằm trong ~/craw-sict/.env của VM (xem .env.worker.example), KHÔNG ghi cứng ở đây.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: VM deploy
        type: choice
        options: [all, vm1, vm2]
        default: all
      tag:
        description: "Image tag = commit SHA trên main (trống = commit đang chạy workflow)"
        type: string
        default: ""
      deploy_embed:
        description: "VM-EMBED: chỉ khởi động ONNX INT8 với artifact đã dựng sẵn"
        type: boolean
        default: false
      deploy_alloy:
        description: "Cấu hình Grafana Alloy (đã cài trên VM) → Grafana Cloud"
        type: boolean
        default: false

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      prefix: ${{ steps.registry.outputs.prefix }}
    steps:
      - id: registry
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sict" >> "$GITHUB_OUTPUT"
      - name: Chỉ deploy từ main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "CD chỉ chạy từ main (đang ở ${{ github.ref }})"; exit 1
      - id: t
        env:
          IN_TAG: ${{ inputs.tag }}
        run: |
          # push trigger thì `inputs.tag` rỗng → tag = SHA của commit vừa merge vào main
          tag="${IN_TAG:-${{ github.sha }}}"
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]] || { echo "tag phải là SHA đầy đủ 40 ký tự"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image của tag phải tồn tại (release-images đã chạy xong)
        # push trigger: release-images chạy song song ngay khi push — chờ tối đa 20 phút thay vì fail ngay
        if: github.event_name == 'push'
        timeout-minutes: 20
        run: |
          for i in $(seq 1 40); do
            ok=1
            for img in api; do
              docker manifest inspect "${{ steps.registry.outputs.prefix }}-$img:${{ steps.t.outputs.tag }}" >/dev/null || ok=0
            done
            [ "$ok" = 1 ] && exit 0
            sleep 30
          done
          echo "release-images chưa build xong image của ${{ steps.t.outputs.tag }} sau 20 phút"; exit 1
      - name: "Image của tag phải tồn tại (deploy tay: phải build xong trước)"
        if: github.event_name != 'push'
        run: |
          images=()
          if [[ '${{ inputs.target }}' == 'all' || '${{ inputs.target }}' == 'vm1' ]]; then images+=(api); fi
          if [[ '${{ inputs.deploy_embed }}' == 'true' && ( '${{ inputs.target }}' == 'all' || '${{ inputs.target }}' == 'vm2' ) ]]; then images+=(embed); fi
          for img in "${images[@]}"; do
            docker manifest inspect "${{ steps.registry.outputs.prefix }}-$img:${{ steps.t.outputs.tag }}" >/dev/null \
              || { echo "thiếu ghcr.io/…/sict-$img:${{ steps.t.outputs.tag }} — chờ workflow release-images"; exit 1; }
          done

  deploy-vm1:
    needs: prepare
    # push trigger chỉ cập nhật API/stores VM-SERVE
    if: inputs.target == 'all' || inputs.target == 'vm1' || github.event_name == 'push'
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Chép file cấu hình (không chép code — code nằm trong image)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM1_HOST }}
          port: ${{ vars.VM1_SSH_PORT || 22 }}
          username: ${{ vars.VM_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.VM1_KEY }}
          source: docker-compose.yml,docker-compose.small.yml,config.yaml,nginx/nginx.conf,nginx/sict-http.conf,scripts/monitor_2vm.sh,scripts/store_auth.sh
          target: ~/craw-sict
      - name: Pull + up (infra, api, nginx)
        uses: appleboy/ssh-action@v1
        env:
          API_IMAGE: ${{ needs.prepare.outputs.prefix }}-api:${{ needs.prepare.outputs.tag }}
          MVP_OCR_POLICY: ${{ secrets.MVP_OCR_POLICY }}
          MVP_OCR_URL: ${{ secrets.MVP_OCR_URL }}
          MVP_OCR_TOKEN: ${{ secrets.MVP_OCR_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VM1_HOST }}
          port: ${{ vars.VM1_SSH_PORT || 22 }}
          username: ${{ vars.VM_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.VM1_KEY }}
          envs: API_IMAGE,MVP_OCR_POLICY,MVP_OCR_URL,MVP_OCR_TOKEN,GH_TOKEN,GH_ACTOR
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd ~/craw-sict
            touch .env
            # D12: thiếu / yếu mật khẩu store hoặc STORE_BIND → dừng trước khi đổi gì (tạo: scripts/store_auth.sh init-env)
            bash scripts/store_auth.sh check vm1
            upsert() { if grep -q "^$1=" .env; then sed -i "s#^$1=.*#$1=$2#" .env; else printf '%s=%s\n' "$1" "$2" >> .env; fi; }
            prev="$(grep '^API_IMAGE=' .env | cut -d= -f2- || true)"
            [ -n "$prev" ] && [ "$prev" != "$API_IMAGE" ] && upsert API_IMAGE_PREV "$prev"
            upsert API_IMAGE "$API_IMAGE"
            # Vercel OCR fallback: values come from the production Environment secrets.
            # Do not print these values; .env stays only on VM-SERVE.
            [ -n "$MVP_OCR_POLICY" ] && upsert MVP_OCR_POLICY "$MVP_OCR_POLICY"
            [ -n "$MVP_OCR_URL" ] && upsert MVP_OCR_URL "$MVP_OCR_URL"
            [ -n "$MVP_OCR_TOKEN" ] && upsert MVP_OCR_TOKEN "$MVP_OCR_TOKEN"
            chmod 600 .env
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose pull api
            docker logout ghcr.io
            # D12: mật khẩu trong .env chỉ áp cho data dir mới → đặt lại mật khẩu user sict trên DB đang có, rồi mới
            # bật API (dùng mật khẩu mới) và recreate redis / qdrant (requirepass, API key)
            docker compose up -d postgres
            for i in $(seq 1 30); do docker compose exec -T postgres pg_isready -U sict -q && break; sleep 2; done
            bash scripts/store_auth.sh sync-pg
            docker compose up -d postgres redis qdrant api nginx
            docker exec -u 0 craw-sict-api-1 chown -R 10000:10000 /cache/hf || true
            # cold start nạp model ~100 s → thử tới 5 phút
            for i in $(seq 1 30); do curl -sf -m 10 http://localhost:8003/app.js -o /dev/null && break; sleep 10; done
            curl -sf -m 10 http://localhost:8003/app.js -o /dev/null
            curl -sf -m 10 http://localhost:8080/nginx-health -o /dev/null || echo "cảnh báo: nginx-health không trả lời"
            # Cửa 1 (host nginx, TLS + redirect) — chỉ đụng khi máy đã cài file này và nội dung khác repo.
            # client_max_body_size của khối 80 là thứ CD không thể bỏ qua: thiếu nó thì POST ảnh lớn nhận 413.
            if sudo -n test -f /etc/nginx/conf.d/sict-http.conf 2>/dev/null; then
              if ! sudo -n diff -q nginx/sict-http.conf /etc/nginx/conf.d/sict-http.conf >/dev/null 2>&1; then
                back=/etc/nginx/conf.d/sict-http.conf.bak-cd
                sudo -n cp /etc/nginx/conf.d/sict-http.conf "$back"
                sudo -n cp nginx/sict-http.conf /etc/nginx/conf.d/sict-http.conf
                if sudo -n nginx -t 2>/dev/null; then
                  sudo -n systemctl reload nginx
                  echo "đã cập nhật host nginx (sict-http.conf)"
                else
                  sudo -n cp "$back" /etc/nginx/conf.d/sict-http.conf
                  echo "BLOCKER: sict-http.conf mới sai cú pháp — đã khôi phục bản cũ" >&2; exit 1
                fi
              fi
            fi
            docker compose ps --format 'table {{.Name}}\t{{.Image}}\t{{.Status}}'

  deploy-embed:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_embed == true && (inputs.target == 'all' || inputs.target == 'vm2')
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM2_HOST }}
          port: ${{ vars.VM2_SSH_PORT || 22 }}
          username: ${{ vars.VM_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.VM2_KEY }}
          source: docker-compose.embed.yml
          target: ~/craw-sict
      - name: Kiểm artifact ONNX dựng sẵn + up embed
        uses: appleboy/ssh-action@v1
        env:
          EMBED_IMAGE: ${{ needs.prepare.outputs.prefix }}-embed:${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VM2_HOST }}
          port: ${{ vars.VM2_SSH_PORT || 22 }}
          username: ${{ vars.VM_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.VM2_KEY }}
          envs: EMBED_IMAGE,GH_TOKEN,GH_ACTOR
          command_timeout: 70m
          script: |
            set -euo pipefail
            cd ~/craw-sict && touch .env
            upsert() { if grep -q "^$1=" .env; then sed -i "s#^$1=.*#$1=$2#" .env; else echo "$1=$2" >> .env; fi; }
            prev="$(grep '^EMBED_IMAGE=' .env | cut -d= -f2- || true)"
            [ -n "$prev" ] && [ "$prev" != "$EMBED_IMAGE" ] && upsert EMBED_IMAGE_PREV "$prev"
            upsert EMBED_IMAGE "$EMBED_IMAGE"
            network="$(grep '^VM2_NETWORK=' .env | cut -d= -f2- || true)"; network="${network:-sict-vm2}"
            docker network inspect "$network" >/dev/null 2>&1 || docker network create "$network"
            # VM-EMBED không chịu được cron/OCR/Obscura đồng thời. Chuyển chúng đi là bước migration có approval riêng.
            if docker ps --format '{{.Names}}' | grep -Eq '(^|[-_])(cron|obscura|svc-ocr)([-_]|$)|^sict-worker-24h$'; then
              echo 'BLOCKER: VM-EMBED còn cron/Obscura/OCR. Hoàn tất migration batch ngoài serving trước.' >&2
              exit 1
            fi
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose -f docker-compose.embed.yml pull embed
            docker logout ghcr.io
            # preflight chỉ đọc và không nạp model; thiếu ONNX/metadata => dừng, không tải/build trên máy 4 GiB.
            docker compose -f docker-compose.embed.yml run --rm --no-deps embed \
              python -m sict_crawler.service.embedding.embed_server verify
            docker compose -f docker-compose.embed.yml up -d embed
            bind="$(grep '^EMBED_BIND=' .env | cut -d= -f2- || true)"; bind="${bind:-127.0.0.1}"
            for i in $(seq 1 60); do curl -sf -m 5 "http://$bind:8090/healthz" | grep -q '"ok":true' && break; sleep 5; done
            curl -sf -m 5 "http://$bind:8090/healthz"

  deploy-alloy:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_alloy
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {vm: vm1, host: VM1_HOST, key: VM1_KEY}
          - {vm: vm2, host: VM2_HOST, key: VM2_KEY}
    steps:
      - uses: actions/checkout@v4
        if: inputs.target == 'all' || inputs.target == matrix.vm
      - name: Cấu hình Alloy (scripts/deploy_alloy_vm.sh → alloy_apply.sh trên VM)
        if: inputs.target == 'all' || inputs.target == matrix.vm
        env:
          GCLOUD_HOSTED_METRICS_URL: ${{ secrets.GCLOUD_HOSTED_METRICS_URL }}
          GCLOUD_HOSTED_METRICS_ID: ${{ secrets.GCLOUD_HOSTED_METRICS_ID }}
          GCLOUD_SCRAPE_INTERVAL: ${{ secrets.GCLOUD_SCRAPE_INTERVAL }}
          GCLOUD_HOSTED_LOGS_URL: ${{ secrets.GCLOUD_HOSTED_LOGS_URL }}
          GCLOUD_HOSTED_LOGS_ID: ${{ secrets.GCLOUD_HOSTED_LOGS_ID }}
          GCLOUD_RW_API_KEY: ${{ secrets.GCLOUD_RW_API_KEY }}
          SSH_KEY: ${{ secrets[matrix.key] }}
          HOST: ${{ secrets[matrix.host] }}
        run: |
          set -euo pipefail
          umask 077
          for k in GCLOUD_HOSTED_METRICS_URL GCLOUD_HOSTED_METRICS_ID GCLOUD_SCRAPE_INTERVAL GCLOUD_HOSTED_LOGS_URL GCLOUD_HOSTED_LOGS_ID GCLOUD_RW_API_KEY; do
            [ -n "${!k}" ] || { echo "BLOCKER: thiếu secret $k"; exit 1; }
            printf '%s=%s\n' "$k" "${!k}"
          done > "$RUNNER_TEMP/alloy.env"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/key.pem"
          ENV_FILE="$RUNNER_TEMP/alloy.env" scripts/deploy_alloy_vm.sh --vm ${{ matrix.vm }} --host "$HOST" --key "$RUNNER_TEMP/key.pem"
      - name: Xác nhận dữ liệu đã vào Grafana Cloud
        if: inputs.target == 'all' || inputs.target == matrix.vm
        env:
          GCLOUD_HOSTED_METRICS_URL: ${{ secrets.GCLOUD_HOSTED_METRICS_URL }}
          GCLOUD_HOSTED_METRICS_ID: ${{ secrets.GCLOUD_HOSTED_METRICS_ID }}
          GCLOUD_HOSTED_LOGS_URL: ${{ secrets.GCLOUD_HOSTED_LOGS_URL }}
          GCLOUD_HOSTED_LOGS_ID: ${{ secrets.GCLOUD_HOSTED_LOGS_ID }}
          GCLOUD_RW_API_KEY: ${{ secrets.GCLOUD_RW_API_KEY }}
        run: |
          umask 077
          env | grep -E '^GCLOUD_' > "$RUNNER_TEMP/alloy.env"
          for i in $(seq 1 12); do
            python3 scripts/verify_gcloud.py --env-file "$RUNNER_TEMP/alloy.env" --instance sict-${{ matrix.vm }} --window 5m && exit 0
            sleep 30
          done
          exit 1
