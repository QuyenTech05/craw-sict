# Worker nang (crawl + OCR + keyframe + subtitle).
# LOCAL (khuyen nghi): chay gop voi infra de chung mang:
#   docker network inspect sict-vm2 >/dev/null 2>&1 || docker network create sict-vm2
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml --profile batch up -d --build
#   (mac dinh tro ve service postgres/redis/qdrant, khong can .env dac biet)
# Batch host riêng: docker compose -f docker-compose.worker.yml --profile batch up -d
#   + .env kết nối stores bằng mạng private; không chạy batch trên VM-EMBED.
#
# Worker chỉ dùng HTTP jina-clip-v2 và ba collection v3 1024-d.
# Production VM2 khai báo EMBED_API_BASE trong .env và kiểm qua `scripts/cutover_v3.sh env-check vm2`.
# worker và embed (kể cả hai Compose project khác nhau) dùng mạng external sict-vm2.
# Trước khi up: docker network create sict-vm2 (CD kiểm tra/tạo trước khi deploy).
x-worker-v3-env: &worker_v3_env
  EMBED_BACKEND: ${EMBED_BACKEND:-api}
  EMBED_API_BASE: ${EMBED_API_BASE:-http://embed:8090/v1}
  EMBED_API_KEY: ${EMBED_API_KEY:-}
  EMBED_MODEL: ${EMBED_MODEL:-jina-clip-v2}
  EMBED_DIM: ${EMBED_DIM:-1024}
  EMBED_QUERY_IMAGE_SIZE: ${EMBED_QUERY_IMAGE_SIZE:-}
  EMBED_CACHE_PATH: ${EMBED_CACHE_PATH:-}   # sqlite cache vector theo hash; VD /app/_local_store/embed_cache.sqlite
  QDRANT_PORT: ${QDRANT_PORT:-}
  QDRANT_GRPC_PORT: ${QDRANT_GRPC_PORT:-}
  QDRANT_COLLECTION_TEXT: ${QDRANT_COLLECTION_TEXT:-sict_text_v3}
  QDRANT_COLLECTION_IMAGE: ${QDRANT_COLLECTION_IMAGE:-sict_image_v3}
  QDRANT_COLLECTION_OCR: ${QDRANT_COLLECTION_OCR:-sict_ocr_v3}
  QDRANT_TEXT_DIM: ${QDRANT_TEXT_DIM:-1024}
  QDRANT_IMAGE_DIM: ${QDRANT_IMAGE_DIM:-1024}
  CHUNK_STRUCTURED: ${CHUNK_STRUCTURED:-1}
  HF_HOME: /cache/hf

services:
  svc-ocr:
    image: ${WORKER_IMAGE:-sict-worker:latest}   # CD đặt ghcr.io/…/sict-worker:<sha> (D10)
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: [{path: .env, required: false}]  # như api: .env (LLM_*, EMBED_*, QDRANT_* v3); thiếu file vẫn up được
    environment:
      <<: *worker_v3_env
      SICT_CONFIG: /app/config.yaml
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      CRAWLER_BACKEND: ${CRAWLER_BACKEND:-auto}
      OBSCURA_BIN: /usr/local/bin/obscura
      OBSCURA_CDP: ws://obscura:9222
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql+asyncpg://sict:${POSTGRES_PASSWORD:-sict}@postgres:5432/sict_crawler}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379/0}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT:-120}
      YT_COOKIES: ${YT_COOKIES:-/cookies/cookies.txt}
      AWS_PROFILE: ${AWS_PROFILE-quyen-admin}
    volumes: ["${WORKER_LOCAL_STORE:-localstore}:/app/_local_store", hfcache:/cache/hf, "${AWS_DIR:-${HOME}/.aws}:/home/app/.aws:ro", "./cookies:/cookies:ro"]
    restart: "no"  # chạy 1 lần rồi thoát; cron bên dưới chạy lặp
    # Chỉ chạy tay; không nằm trong profile serving.
    # `docker compose run --rm svc-ocr …` vẫn chạy được. Chỉ có tác dụng với collection v1.
    profiles: ["manual"]
    networks: [default, vm2]
    mem_limit: 3000m
    logging: {driver: json-file, options: {max-size: 20m, max-file: "3"}}
    command: ["python", "-m", "sict_crawler.pipeline.main", "--annotate-ocr", "2000"]

  # Cron incremental 12h/lần trên batch host độc lập, chỉ bật profile batch.
  cron:
    profiles: ["batch"]
    image: ${WORKER_IMAGE:-sict-worker:latest}   # CD đặt ghcr.io/…/sict-worker:<sha> (D10)
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: [{path: .env, required: false}]  # như api (docker-compose.yml): bộ biến v3 + LLM/AWS từ .env của VM2
    environment:
      <<: *worker_v3_env
      SICT_CONFIG: /app/config.yaml
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      CRAWLER_BACKEND: ${CRAWLER_BACKEND:-auto}
      OBSCURA_BIN: /usr/local/bin/obscura
      OBSCURA_CDP: ws://obscura:9222
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql+asyncpg://sict:${POSTGRES_PASSWORD:-sict}@postgres:5432/sict_crawler}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379/0}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT:-120}
      YT_COOKIES: ${YT_COOKIES:-/cookies/cookies.txt}
      AWS_PROFILE: ${AWS_PROFILE-quyen-admin}
      CHECK_EDITS: ${CHECK_EDITS:-50}
      CRAWL_LIMIT: ${CRAWL_LIMIT:-200}
      ANNOTATE_OCR_N: ${ANNOTATE_OCR_N:-500}
      CYCLE_BUDGET_SEC: ${CYCLE_BUDGET_SEC:-300}
      CRON_INTERVAL_SEC: ${CRON_INTERVAL_SEC:-43200}
      CRON_RETRY_SEC: ${CRON_RETRY_SEC:-300}
    volumes: ["${WORKER_LOCAL_STORE:-localstore}:/app/_local_store", hfcache:/cache/hf, "${AWS_DIR:-${HOME}/.aws}:/home/app/.aws:ro", "./cookies:/cookies:ro"]
    restart: unless-stopped
    # Đỉnh đo 2026-10-29 (chạy thử 2 vCPU, cả lượt tồn đọng 12 bài mới): 408 MiB, rỗi ~62 MiB. 1 GB chừa
    # ~2,5× cho batch host riêng; không ghép cùng embed serving.
    mem_limit: ${CRON_MEM_LIMIT:-1024m}
    logging: {driver: json-file, options: {max-size: 20m, max-file: "3"}}
    depends_on: [obscura]
    networks: [default, vm2]
    command: >
      /bin/sh -c "while true; do
        if python -m sict_crawler.pipeline.main --incremental --check-edits $$CHECK_EDITS --crawl-limit $$CRAWL_LIMIT --annotate-ocr-n $$ANNOTATE_OCR_N --budget-sec $$CYCLE_BUDGET_SEC; then
          sleep $$CRON_INTERVAL_SEC;
        else
          sleep $$CRON_RETRY_SEC;
        fi; done"

  # Sidecar Obscura CDP cho trang JS nặng. Chỉ chạy trên batch host.
  obscura:
    profiles: ["batch"]
    image: h4ckf0r0day/obscura:0.2.4
    command: ["serve", "--port", "9222"]
    ports: ["127.0.0.1:9222:9222"]
    restart: unless-stopped
    mem_limit: 150m
    networks: [vm2]

networks:
  vm2:
    name: ${VM2_NETWORK:-sict-vm2}
    external: true

volumes:
  localstore:
  hfcache:
