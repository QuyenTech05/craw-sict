# Edge nginx CU 1 (host, ngoai Docker) — TLS + redirect HTTP → HTTPS truoc nginx trong compose (127.0.0.1:8080).
# Cai tren VM1: sudo cp nginx/sict-http.conf /etc/nginx/conf.d/sict-http.conf && sudo nginx -t && sudo systemctl reload nginx
#
# client_max_body_size phai co o CA HAI khoi: anh truy van di trong JSON dang base64 (~2 MB cho anh
# 1,5 MB). Khoi 80 kiem tra body size TRUOC khi return 301, nen thieu dong nay thi POST toi http://
# nhan 413 thay vi duoc redirect sang HTTPS (2026-11-16).
server {
    listen 80;
    server_name mmsict.linkpc.net;
    client_max_body_size 16m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/sict-acme; }
    location / { return 301 https://mmsict.linkpc.net$request_uri; }
}
server {
    listen 443 ssl;
    server_name mmsict.linkpc.net;
    ssl_certificate /etc/letsencrypt/live/mmsict.linkpc.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mmsict.linkpc.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
