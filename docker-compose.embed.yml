# VM-EMBED 2 vCPU/4 GiB, chỉ phục vụ HTTP ONNX INT8 warm. Artifact ONNX + tokenizer phải dựng trước
# trên host RAM >= 6 GiB và chép vào volume embedhf; runtime từ chối tự tải/build trên máy 4 GiB.
# Xem docs/batch-off-serving.md và docs/placement-rollout-new-runtime.md.
services:
  embed:
    build: {context: ., dockerfile: Dockerfile.embed}
    image: ${EMBED_IMAGE:-sict-embed:latest}   # CD đặt ghcr.io/…/sict-embed:<sha> (D10)
    environment:
      EMBED_THREADS: ${EMBED_THREADS:-2}
      EMBED_TEXT_MAX_LEN: ${EMBED_TEXT_MAX_LEN:-1536}
      EMBED_TOKEN_BUDGET: ${EMBED_TOKEN_BUDGET:-1536}
      EMBED_CONCURRENCY: ${EMBED_CONCURRENCY:-1}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_IMAGE_BATCH: ${EMBED_IMAGE_BATCH:-1}
      EMBED_QUERY_IMAGE_SIZES: ${EMBED_QUERY_IMAGE_SIZES:-336}   # tháp ảnh truy vấn; API đặt EMBED_QUERY_IMAGE_SIZE cùng giá trị
      EMBED_REQUIRE_PREBUILT: "1"
      # Chỉ cần tokenizer/preprocessor/config tại đây; model fp32 không nằm trên VM-EMBED.
      EMBED_ONNX_DIR: /hf/sict-source
    # D12: không mở ra internet — VM2 đặt EMBED_BIND=<IP private VM2> trong .env để API ở VM1 gọi được (SG chỉ cho VM1)
    ports: ["${EMBED_BIND:-127.0.0.1}:${EMBED_PORT:-8090}:8090"]
    volumes: [embedhf:/hf]
    restart: unless-stopped
    mem_limit: ${EMBED_MEM_LIMIT:-3500m}
    networks: [vm2]

networks:
  vm2:
    name: ${VM2_NETWORK:-sict-vm2}
    external: true

volumes:
  embedhf:
